<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TapGrain</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ---------- Base ---------- */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(180deg, #1b1f3a 0%, #0f1124 100%);
      color: #ffffff;
      font-family: -apple-system, Roboto, Arial, sans-serif;
    }

    /* ---------- Top bar ---------- */
    .top {
      width: 100%;
      padding: 18px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hello {
      font-size: 16px;
      opacity: 0.85;
    }

    .level {
      background: #ffb703;
      color: #3a2a00;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* ---------- Score ---------- */
    .score-box {
      margin-top: 30px;
      text-align: center;
    }

    .score {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      color: #ffd166;
    }

    .label {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.7;
    }

    /* ---------- Progress bar ---------- */
    .bar {
      width: 80%;
      max-width: 320px;
      height: 10px;
      margin: 22px auto 0;
      background: #ffffff22;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffb703, #fb8500);
      transition: width 0.2s;
    }

    /* ---------- Tap area ---------- */
    .tap-area {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grain {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb703 55%, #c77800);
      box-shadow: 0 0 40px #ffb70066, inset 0 -10px 25px #00000033;
      transition: transform 0.08s;
    }

    .grain:active {
      transform: scale(0.93);
    }

    /* ---------- "+1" animation ---------- */
    .float {
      position: absolute;
      font-size: 26px;
      font-weight: 800;
      color: #ffd166;
      pointer-events: none;
      animation: rise 0.8s ease-out forwards;
    }

    @keyframes rise {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-90px);
      }
    }

  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="top">
    <div class="hello" id="hello">Hi!</div>
    <div class="level" id="level">Level 1</div>
  </div>

  <!-- Score -->
  <div class="score-box">
    <div class="score" id="score">...</div>
    <div class="label">Grains collected</div>
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
  </div>

  <!-- Tap area -->
  <div class="tap-area" id="area">
    <div class="grain" id="grain">🌾</div>
  </div>


  <script>
    // ---------- Settings ----------
    const API_URL = 'https://ikexyelkowbnvhgkkhfa.supabase.co/functions/v1/smart-handler';
    const PER_LEVEL = 50;

    // ---------- Telegram setup ----------
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#1b1f3a');
    tg.setBackgroundColor('#1b1f3a');

    const user = tg.initDataUnsafe.user;
    const ref = tg.initDataUnsafe.start_param;

    document.getElementById('hello').textContent =
      'Hi ' + (user ? user.first_name : 'there') + ' 👋';


    // ---------- Game state ----------
    let score = 0;         // score shown on screen
    let pending = 0;       // taps not yet saved online
    let loaded = false;    // true after the first reply from the server
    let syncing = false;   // true while a save is in progress
    let timer = null;      // short delay before saving


    // ---------- Update the screen ----------
    function render() {
      const level = Math.floor(score / PER_LEVEL) + 1;
      const progress = (score % PER_LEVEL) / PER_LEVEL * 100;

      document.getElementById('score').textContent = loaded ? score : '...';
      document.getElementById('level').textContent = 'Level ' + level;
      document.getElementById('fill').style.width = progress + '%';
    }


    // ---------- Save to / load from the server (silently) ----------
    async function sync() {
      clearTimeout(timer);
      timer = null;

      if (syncing) return;
      if (loaded && pending === 0) return;

      syncing = true;
      const toSend = Math.min(pending, 200);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          keepalive: true,   // lets the save finish even if the app closes
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData,
            add: toSend,
            ref: ref
          })
        });
        const data = await res.json();

        if (res.ok && typeof data.score === 'number') {
          pending -= toSend;
          score = data.score + pending;
          loaded = true;
          render();
        }
      } catch (err) {
        // ignore, it will retry automatically
      }

      syncing = false;

      // Taps that came in while saving: save them right away
      if (pending > 0) saveSoon(100);
    }

    function saveSoon(delay) {
      if (timer) return;
      timer = setTimeout(sync, delay);
    }


    // ---------- Handle a tap ----------
    function tap(e) {
      if (!loaded) return;

      score++;
      pending++;
      render();
      saveSoon(300);   // save 0.3 seconds after tapping
      tg.HapticFeedback.impactOccurred('light');

      // Floating "+1"
      const area = document.getElementById('area');
      const rect = area.getBoundingClientRect();

      const plusOne = document.createElement('div');
      plusOne.className = 'float';
      plusOne.textContent = '+1';
      plusOne.style.left = (e.clientX - rect.left - 10) + 'px';
      plusOne.style.top = (e.clientY - rect.top - 30) + 'px';

      area.appendChild(plusOne);
      setTimeout(() => plusOne.remove(), 800);
    }


    // ---------- Start ----------
    document.getElementById('grain').addEventListener('pointerdown', tap);

    // Backup: retry every 2 seconds if anything is still unsaved
    setInterval(sync, 2000);

    // Save immediately when the app is closed or hidden
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sync();
    });
    window.addEventListener('pagehide', sync);

    render();
    sync();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TapGrain</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ---------- Base ---------- */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 50% 0%, #3b2a7a 0%, transparent 55%),
        radial-gradient(circle at 50% 100%, #7a4a0a 0%, transparent 50%),
        linear-gradient(180deg, #181a3a 0%, #0c0e1f 100%);
      color: #ffffff;
      font-family: -apple-system, Roboto, Arial, sans-serif;
    }

    /* ---------- Floating golden dust ---------- */
    .dust {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      background: #ffd166;
      opacity: 0;
      pointer-events: none;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(0) scale(1);        opacity: 0; }
      15%  { opacity: 0.7; }
      100% { transform: translateY(-105vh) scale(0.4); opacity: 0; }
    }

    /* ---------- Top bar ---------- */
    .top {
      width: calc(100% - 32px);
      margin-top: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff12;
      border: 1px solid #ffffff1f;
      border-radius: 18px;
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #3a2a00;
      background: linear-gradient(135deg, #ffe08a, #fb8500);
    }

    .name {
      font-size: 15px;
      font-weight: 600;
    }

    .title {
      font-size: 12px;
      opacity: 0.65;
    }

    .level {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      color: #3a2a00;
      background: linear-gradient(135deg, #ffe08a, #ffb703);
      box-shadow: 0 0 14px #ffb70055;
    }

    /* ---------- Score ---------- */
    .score-box {
      margin-top: 28px;
      text-align: center;
      z-index: 2;
    }

    .score {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #fff1b8, #ffb703);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 18px #ffb70066);
    }

    .score.bump {
      animation: bump 0.15s ease-out;
    }

    @keyframes bump {
      50% { transform: scale(1.08); }
    }

    .label {
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* ---------- Progress bar ---------- */
    .progress {
      width: 78%;
      max-width: 320px;
      margin: 20px auto 0;
    }

    .bar {
      height: 12px;
      background: #ffffff1a;
      border: 1px solid #ffffff1f;
      border-radius: 12px;
      overflow: hidden;
    }

    .fill {
      width: 0%;
      height: 100%;
      border-radius: 12px;
      background: linear-gradient(90deg, #ffb703, #fb8500, #ff5d8f);
      box-shadow: 0 0 12px #fb850088;
      transition: width 0.2s;
    }

    .progress-text {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.6;
    }

    /* ---------- Tap area ---------- */
    .tap-area {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .grain-wrap {
      position: relative;
      width: 230px;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Glowing pulse behind the grain */
    .grain-wrap::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffb70055 0%, transparent 70%);
      animation: pulse 2.2s ease-in-out infinite;
    }

    /* Slowly turning dashed ring */
    .grain-wrap::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px dashed #ffd16655;
      animation: spin 18s linear infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50%      { transform: scale(1.1);  opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .grain {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 96px;
      z-index: 1;
      background: radial-gradient(circle at 35% 28%, #fff3c4, #ffc83d 45%, #e08e00 80%, #a85f00);
      box-shadow:
        0 14px 40px #00000066,
        0 0 50px #ffb70066,
        inset 0 -14px 28px #00000040,
        inset 0 10px 20px #ffffff55;
      transition: transform 0.12s ease-out;
    }

    /* ---------- Tap effects ---------- */
    .float {
      position: absolute;
      font-size: 28px;
      font-weight: 900;
      color: #ffe08a;
      text-shadow: 0 2px 10px #000000aa;
      pointer-events: none;
      z-index: 5;
      animation: rise 0.9s ease-out forwards;
    }

    @keyframes rise {
      from { opacity: 1; transform: translate(0, 0) scale(0.8); }
      to   { opacity: 0; transform: translate(var(--dx), -110px) scale(1.3); }
    }

    .ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      margin: -15px 0 0 -15px;
      border-radius: 50%;
      border: 3px solid #fff3c4;
      pointer-events: none;
      z-index: 4;
      animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
      from { opacity: 0.9; transform: scale(0.5); }
      to   { opacity: 0;   transform: scale(5); }
    }

    /* ---------- Level up banner ---------- */
    .levelup {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 28px;
      border-radius: 20px;
      font-size: 26px;
      font-weight: 900;
      white-space: nowrap;
      color: #3a2a00;
      background: linear-gradient(135deg, #fff1b8, #ffb703);
      box-shadow: 0 0 40px #ffb703aa;
      pointer-events: none;
      z-index: 10;
      animation: pop 1.6s ease-out forwards;
    }

    @keyframes pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      30%  { transform: translate(-50%, -50%) scale(1); }
      80%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
    }

    /* ---------- Hint ---------- */
    .hint {
      padding: 14px;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.4;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="top">
    <div class="player">
      <div class="avatar" id="avatar">T</div>
      <div>
        <div class="name" id="name">Hi!</div>
        <div class="title" id="title">Seedling</div>
      </div>
    </div>
    <div class="level" id="level">Lv 1</div>
  </div>

  <!-- Score -->
  <div class="score-box">
    <div class="score" id="score">...</div>
    <div class="label">Grains collected</div>

    <div class="progress">
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
      <div class="progress-text" id="progressText"></div>
    </div>
  </div>

  <!-- Tap area -->
  <div class="tap-area" id="area">
    <div class="grain-wrap">
      <div class="grain" id="grain">🌾</div>
    </div>
  </div>

  <div class="hint">TAP THE GRAIN</div>


  <script>
    // ---------- Settings ----------
    const API_URL = 'https://ikexyelkowbnvhgkkhfa.supabase.co/functions/v1/smart-handler';
    const PER_LEVEL = 50;
    const TITLES = [
      'Seedling', 'Sprout', 'Gardener', 'Farmer', 'Harvester',
      'Miller', 'Baker', 'Grain Master', 'Golden Legend'
    ];

    // ---------- Telegram setup ----------
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#181a3a');
    tg.setBackgroundColor('#181a3a');

    const user = tg.initDataUnsafe.user;
    const ref = tg.initDataUnsafe.start_param;
    const firstName = user ? user.first_name : 'Player';

    document.getElementById('name').textContent = firstName;
    document.getElementById('avatar').textContent = firstName.charAt(0).toUpperCase();


    // ---------- Game state ----------
    let score = 0;         // score shown on screen
    let pending = 0;       // taps not yet saved online
    let loaded = false;    // true after the first reply from the server
    let syncing = false;   // true while a save is in progress
    let timer = null;      // short delay before saving


    // ---------- Helpers ----------
    function levelOf(n) {
      return Math.floor(n / PER_LEVEL) + 1;
    }

    // ---------- Update the screen ----------
    function render() {
      const level = levelOf(score);
      const into = score % PER_LEVEL;

      document.getElementById('score').textContent =
        loaded ? score.toLocaleString() : '...';
      document.getElementById('level').textContent = 'Lv ' + level;
      document.getElementById('title').textContent =
        TITLES[Math.min(level - 1, TITLES.length - 1)];
      document.getElementById('fill').style.width = (into / PER_LEVEL * 100) + '%';
      document.getElementById('progressText').textContent =
        into + ' / ' + PER_LEVEL + ' to Level ' + (level + 1);
    }


    // ---------- Save to / load from the server (silently) ----------
    async function sync() {
      clearTimeout(timer);
      timer = null;

      if (syncing) return;
      if (loaded && pending === 0) return;

      syncing = true;
      const toSend = Math.min(pending, 200);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          keepalive: true,   // lets the save finish even if the app closes
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData,
            add: toSend,
            ref: ref
          })
        });
        const data = await res.json();

        if (res.ok && typeof data.score === 'number') {
          pending -= toSend;
          score = data.score + pending;
          loaded = true;
          render();
        }
      } catch (err) {
        // ignore, it will retry automatically
      }

      syncing = false;

      // Taps that came in while saving: save them right away
      if (pending > 0) saveSoon(100);
    }

    function saveSoon(delay) {
      if (timer) return;
      timer = setTimeout(sync, delay);
    }


    // ---------- Visual effects ----------
    function addEffect(className, text, x, y, extra) {
      const area = document.getElementById('area');
      const el = document.createElement('div');
      el.className = className;
      if (text) el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      if (extra) el.style.setProperty('--dx', extra + 'px');
      area.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function showLevelUp(level) {
      const el = document.createElement('div');
      el.className = 'levelup';
      el.textContent = '🎉 Level ' + level + '!';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1600);
      tg.HapticFeedback.notificationOccurred('success');
    }

    function makeDust() {
      for (let i = 0; i < 22; i++) {
        const d = document.createElement('span');
        const size = 3 + Math.random() * 5;
        d.className = 'dust';
        d.style.width = d.style.height = size + 'px';
        d.style.left = Math.random() * 100 + '%';
        d.style.animationDuration = 7 + Math.random() * 9 + 's';
        d.style.animationDelay = -Math.random() * 12 + 's';
        document.body.appendChild(d);
      }
    }


    // ---------- Handle a tap ----------
    function tap(e) {
      if (!loaded) return;

      const before = levelOf(score);
      score++;
      pending++;
      render();
      saveSoon(300);   // save 0.3 seconds after tapping
      tg.HapticFeedback.impactOccurred('light');

      // Score bump
      const scoreEl = document.getElementById('score');
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');

      // Tilt the grain toward the finger
      const grain = document.getElementById('grain');
      const g = grain.getBoundingClientRect();
      const dx = (e.clientX - (g.left + g.width / 2)) / (g.width / 2);
      const dy = (e.clientY - (g.top + g.height / 2)) / (g.height / 2);
      grain.style.transform =
        'perspective(500px) rotateX(' + (-dy * 14) + 'deg) rotateY(' + (dx * 14) + 'deg) scale(0.94)';
      setTimeout(() => { grain.style.transform = ''; }, 110);

      // Floating "+1" and ripple
      const rect = document.getElementById('area').getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      addEffect('ripple', '', x, y);
      addEffect('float', '+1', x - 10, y - 30, (Math.random() - 0.5) * 60);

      // Level up
      if (levelOf(score) > before) showLevelUp(levelOf(score));
    }


    // ---------- Start ----------
    document.getElementById('grain').addEventListener('pointerdown', tap);

    // Backup: retry every 2 seconds if anything is still unsaved
    setInterval(sync, 2000);

    // Save immediately when the app is closed or hidden
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sync();
    });
    window.addEventListener('pagehide', sync);

    makeDust();
    render();
    sync();
  </script>

</body>
</html>
